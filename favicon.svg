<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="32%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#1b2133"/>
      <stop offset="58%" stop-color="#0d1018"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f26444" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f26444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="52%" stop-color="#f4c152"/>
      <stop offset="100%" stop-color="#f26444"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5dfd3"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="25%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#ff8a6b"/>
      <stop offset="60%" stop-color="#f26444"/>
      <stop offset="100%" stop-color="#c93b1d"/>
    </linearGradient>
  </defs>

  <!-- Obsidian squircle badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#f3f1ea" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Subtle ambient core glow -->
  <circle cx="34" cy="34" r="22" fill="url(#glow)"/>

  <!-- Back orbital astrolabe ring -->
  <ellipse cx="32" cy="33" rx="24" ry="9.5" transform="rotate(-26 32 33)" fill="none" stroke="url(#orbitGrad)" stroke-width="2.4" stroke-opacity="0.88"/>

  <!-- Stylized geometric "A" monogram (no external fonts needed) -->
  <path d="M29.4 16.5 L15.4 47.5 L21.7 47.5 L24.7 40.3 L36.6 40.3 L39.5 47.5 L46.1 47.5 L32.7 16.5 Z M26.8 35.2 L30.7 25.4 L34.6 35.2 Z" fill="url(#letterGrad)"/>

  <!-- Front orbital arc highlight crossing subtly in front -->
  <path d="M12.2 42.6 A24 9.5 -26 0 0 51.8 23.4" fill="none" stroke="url(#orbitGrad)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Orbiting teal satellite node -->
  <circle cx="51.2" cy="23.7" r="3.1" fill="#4fd1c5"/>
  <circle cx="50.4" cy="22.9" r="1.1" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Signature vermilion "Ansh." 3D-shaded dot -->
  <circle cx="50.5" cy="44.8" r="5.1" fill="url(#dotGrad)"/>
  <circle cx="48.9" cy="43.1" r="1.5" fill="#ffffff" fill-opacity="0.55"/>
</svg>